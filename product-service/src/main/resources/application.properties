spring.application.name=product-service
server.port=${SERVER_PORT:8081}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/product_db}
spring.datasource.username=${DB_USERNAME:product_user}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.default_batch_fetch_size=50
spring.data.web.pageable.max-page-size=50



jwt.jwks-uri=${JWKS_URI:http://localhost:8082/.well-known/jwks.json}
jwt.issuer=${JWT_ISSUER:http://auth-service}

management.endpoints.web.exposure.include=health