spring.application.name=auth-service
server.port=${SERVER_PORT:8082}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/auth_db}
spring.datasource.username=${DB_USERNAME:auth_user}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

jwt.issuer=${JWT_ISSUER:http://auth-service}
jwt.access-expiration=15m
jwt.refresh-expiration=30d
jwt.private-key=${JWT_PRIVATE_KEY:}
jwt.allow-ephemeral-key=${JWT_ALLOW_EPHEMERAL_KEY:false}

app.cookie.secure=${APP_COOKIE_SECURE:true}
management.endpoints.web.exposure.include=health