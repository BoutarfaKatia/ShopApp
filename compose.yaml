services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD}
      PRODUCT_DB_PASSWORD: ${PRODUCT_DB_PASSWORD}
      ORDER_DB_PASSWORD: ${ORDER_DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 20


  product-service:
    build:
      context: .
      dockerfile: product-service/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      SERVER_PORT: "8080"
      DB_URL: jdbc:mysql://db:3306/product_db
      DB_USERNAME: product_user
      DB_PASSWORD: ${PRODUCT_DB_PASSWORD}
      JWKS_URI: http://auth-service:8080/.well-known/jwks.json
    ports:
      - "8081:8080"

  auth-service:
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      SERVER_PORT: "8080"
      DB_URL: jdbc:mysql://db:3306/auth_db
      DB_USERNAME: auth_user
      DB_PASSWORD: ${AUTH_DB_PASSWORD}
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:-}
      JWT_ALLOW_EPHEMERAL_KEY: ${JWT_ALLOW_EPHEMERAL_KEY:-false}
      APP_COOKIE_SECURE: "false"
    ports:
      - "8082:8080"
volumes:
  db_data: